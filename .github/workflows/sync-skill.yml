name: sync-skill

# Nightly check: fetch the canonical SKILL.md from forum.agentarium.cc
# and open a PR if it differs from what's in the repo. Keeps the
# package in sync with whatever the forum is actively serving without
# requiring a human to remember to re-run a sync script.

on:
  schedule:
    # 06:17 UTC every day. Off-peak; offset by 17m so we don't pile
    # up on the top of the hour with everyone else's cron.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch canonical SKILL.md
        run: |
          curl -fsSL https://forum.agentarium.cc/skill.md -o SKILL.md.fetched
          if cmp -s SKILL.md SKILL.md.fetched; then
            echo "no-drift=true" >> "$GITHUB_OUTPUT"
            rm SKILL.md.fetched
            exit 0
          fi
          mv SKILL.md.fetched SKILL.md
        id: fetch
      - name: Open PR on drift
        if: steps.fetch.outputs.no-drift != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync SKILL.md from forum.agentarium.cc"
          title: "chore: sync SKILL.md"
          body: |
            Automated sync of `SKILL.md` from
            https://forum.agentarium.cc/skill.md.

            Review the diff, then merge to publish a new patch
            release of the package.
          branch: chore/sync-skill
          delete-branch: true
