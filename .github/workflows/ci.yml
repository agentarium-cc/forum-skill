name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # No `version:` here — pnpm/action-setup@v4 reads it from
      # the `packageManager` field in package.json. Specifying
      # both surfaces causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Drift guard: the committed SKILL.md must match what
      # scripts/sync-skill.js produces from the pinned skills/
      # submodule. Without this, a human could hand-edit SKILL.md
      # and the daily auto-bump cron wouldn't catch it (the cron
      # only re-syncs when the submodule pointer moves). `prepack`
      # regenerates SKILL.md before npm publish so the tarball is
      # always correct, but this keeps the repo honest too —
      # otherwise the GitHub-rendered SKILL.md could mislead
      # anyone reading the source.
      - name: Verify SKILL.md is in sync with the submodule
        run: |
          pnpm sync-skill
          if ! git diff --exit-code SKILL.md; then
            echo "::error::SKILL.md drifted from skills/skills/forum/SKILL.md."
            echo "Run 'pnpm sync-skill' locally and commit the result."
            exit 1
          fi

      - name: Smoke test installed CLI
        run: |
          # Run install against a tmp HOME so we don't trample real
          # ~/.claude — and pass AGENTARIUM_TOKEN so the device-flow
          # registration is skipped.
          export TMP_HOME=$(mktemp -d)
          export CLAUDE_CONFIG_DIR=$TMP_HOME
          export AGENTARIUM_HOME=$TMP_HOME/agnt
          export AGENTARIUM_TOKEN=agnt_ci_smoke_test
          node dist/cli.js install --no-register
          test -f $TMP_HOME/skills/forum-skill/SKILL.md
          grep -q '"id": "forum-skill:heartbeat"' $TMP_HOME/settings.json
          node dist/cli.js status
          node dist/cli.js uninstall

      # Critical regression guard: when the binary is invoked via
      # the `bin` field (the way it'll be invoked by `npx
      # forum-skill`), the kernel uses the file's shebang. If the
      # shebang is missing or not on line 1, /bin/sh runs the
      # bundle as a shell script and the user sees `import:
      # command not found`. We caught this exact bug shipping
      # 0.1.0 — never again.
      - name: Verify shebang + executable bit + bin runs
        run: |
          # Shebang on line 1.
          head -1 dist/cli.js | grep -q "^#!/usr/bin/env node" \
            || (echo "::error::dist/cli.js missing shebang on line 1" && exit 1)
          # Executable.
          test -x dist/cli.js \
            || (echo "::error::dist/cli.js not executable" && exit 1)
          # And actually pack-and-run via the published bin field.
          npm pack --silent
          TARBALL=$(ls forum-skill-*.tgz)
          INSTALL_DIR=$(mktemp -d)
          cd "$INSTALL_DIR"
          npm init -y >/dev/null
          npm install --silent "$OLDPWD/$TARBALL"
          npx --no-install forum-skill --version
