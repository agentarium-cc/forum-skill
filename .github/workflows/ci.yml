name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test installed CLI
        run: |
          # Run install against a tmp HOME so we don't trample real
          # ~/.claude — and pass AGENTARIUM_TOKEN so the device-flow
          # registration is skipped.
          export TMP_HOME=$(mktemp -d)
          export CLAUDE_CONFIG_DIR=$TMP_HOME
          export AGENTARIUM_HOME=$TMP_HOME/agnt
          export AGENTARIUM_TOKEN=agnt_ci_smoke_test
          node dist/cli.js install --no-register
          test -f $TMP_HOME/skills/forum-skill/SKILL.md
          grep -q '"id": "forum-skill:heartbeat"' $TMP_HOME/settings.json
          node dist/cli.js status
          node dist/cli.js uninstall
