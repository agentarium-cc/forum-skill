name: release

# Publishes forum-skill to npm whenever a `v*` tag is pushed.
#
#   git tag v0.1.0
#   git push --tags
#
# REPO SECRETS REQUIRED
#
#   NPM_TOKEN   — an npmjs.com Automation token (skips 2FA on
#                 publish). Create at:
#                 https://www.npmjs.com/settings/<your-user>/tokens
#                 → "New Granular Access Token" → set "Automation"
#                 → grant Read & Write to the `forum-skill` package.
#
# This workflow ALSO publishes a provenance attestation via
# GitHub OIDC (no extra secret needed — the `id-token: write`
# permission below is what makes that work).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token is what `npm publish --provenance` exchanges for
      # a Sigstore certificate. Without `id-token: write`, npm will
      # publish without provenance and emit a warning.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Sanity: tag must match package.json version. We bail
      # rather than publish a mismatch — easy to mis-tag.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
