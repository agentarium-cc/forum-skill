name: release

# Publishes forum-skill to npm whenever a `v*` tag is pushed.
#
#   git tag v0.1.0
#   git push --tags
#
# AUTH: npm Trusted Publishing (OIDC). No NPM_TOKEN required.
#
# Setup (one-time, on npmjs.com):
#
#   1. Sign in at https://www.npmjs.com.
#   2. Open this package's settings:
#        https://www.npmjs.com/package/forum-skill/access
#      (after the FIRST manual publish — see "bootstrap" below).
#   3. Under "Publishing access" → "Trusted Publisher" → "Add":
#        Repository owner:    agentarium-cc
#        Repository name:     forum-skill
#        Workflow filename:   release.yml
#        Environment:         (leave empty unless you wire one up)
#   4. Save.
#
# That's the entire setup. From here on, this workflow exchanges
# its GitHub OIDC token for an ephemeral npm publish token —
# nothing is stored as a long-lived secret.
#
# BOOTSTRAP: The very first publish has to happen manually because
# the package doesn't exist on npm yet (and you can't add a Trusted
# Publisher to a package that doesn't exist). Locally:
#
#     npm login
#     npm publish --access public          # NO --provenance flag
#
# (Provenance attestation needs an OIDC provider, which isn't
# available from a developer laptop. Every release that runs
# through THIS workflow WILL be signed.)
#
# Then configure the Trusted Publisher in the npm UI per the steps
# above. Every subsequent release goes through this workflow with
# zero credentials.
#
# Why Node 24: npm Trusted Publishing needs npm >= 11.5.1.
# Node 24 LTS ships with npm 11.x out of the box, so we don't
# need a fragile `npm install -g npm@latest` step (which can
# corrupt the npm install mid-self-replace; see commit log).

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token — both Trusted Publishing AND --provenance need
      # `id-token: write`. Without this, the OIDC exchange fails
      # and `npm publish` falls back to looking for a token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # pnpm/action-setup@v4 reads `packageManager` from
      # package.json — don't pass `version:` here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS ships with npm 11.x, which has Trusted
          # Publishing baked in. Avoids the fragile in-flight npm
          # self-upgrade (`npm install -g npm@latest` was failing
          # with MODULE_NOT_FOUND for promise-retry — npm 10
          # replacing itself with npm 11 mid-run loses native deps).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Sanity: tag must match package.json version. We bail
      # rather than publish a mismatch — easy to mis-tag.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # No NODE_AUTH_TOKEN here. With Trusted Publishing
      # configured on npmjs.com, the npm CLI auto-exchanges the
      # GitHub OIDC token (provided by `id-token: write`) for an
      # ephemeral publish credential. Provenance is signed via
      # the same OIDC flow.
      - name: Publish to npm (Trusted Publishing + Provenance)
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
